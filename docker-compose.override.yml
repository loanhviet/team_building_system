# Dev mode, auto-loaded by plain `docker compose`: bind-mounted source + hot reload.
services:
  qdrant:
    ports:
      - "6363:6333"

  api:
    volumes:
      - ./apps/api:/app
      - ./data:/data
    command: ["sh", "./entrypoint.sh", "--reload"]

  worker:
    volumes:
      - ./apps/api:/app
      - ./data:/data
    # Keep the same Redis liveness watchdog in development; code changes still
    # take effect after Docker restarts the worker.
    command: python -m app.worker.supervisor

  web:
    build:
      target: deps
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    command: sh -c "npm run dev"

volumes:
  web_node_modules:
  web_next_cache:
