[project]
name = "team-building-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "arq>=0.26",
    "redis>=5.2",
    "bcrypt>=4.1",
    "pyjwt>=2.10",
    "python-multipart>=0.0.17",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "aiosmtplib>=3.0",
    "python-json-logger>=2.0",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    "openai>=1.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
